[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flameguard-si"
version = "0.1.0"
description = "Research dashboard for NASA microgravity combustion investigations (NASA Space Apps 2026)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/flameguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests", "tools"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
