name: CI

on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        env:
          FLAMEGUARD_AI_API_KEY: ""
        run: pytest
      - name: Data provenance
        run: python tools/check_data_provenance.py

  frontend:
    # Runs the frontend's in-browser test harness (frontend/tests/index.html) in headless
    # Chrome, which GitHub's ubuntu runners include. No extra dependency. Until the
    # frontend lands on main the script reports "SKIPPED (not verified)", never a pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Frontend browser tests (headless Chrome)
        run: python .github/scripts/run_frontend_tests.py

  secrets-and-raw-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse committed .env or raw media
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|\.(nef|NEF|mp4|MP4|mov|avi|zip|pdf)$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
          echo "No .env or raw media tracked."
